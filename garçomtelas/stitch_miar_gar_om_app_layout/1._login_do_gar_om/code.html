 flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-screen-margin-mobile pb-space-2xl relative">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-72 bg-primary-container/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
<div class="relative w-20 h-20 mb-space-sm flex items-center justify-center rounded-xl bg-surface-container-high shadow-md">
<img alt="MIAR Logo" class="w-16 h-16 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1WYQcQu6Ll73GcEzNH7wxUhTIol29EZRu4gXGLw999HgUdXWkMi94HTyIlVYc4FU-QBi_-DS_zIzaJtvSZVf5yn4nXBPlyyneMZdKTQlp-eMm8iLonFoZj5N7EI-IF5DoZAJTYizL55CUU37NJ71bVp-I94nejLGfOYw8aPSULGiV8kT8IyUGoIzeNUx-ChB7jk9mjC8y755Tb2G1VF5RpjHJgxFQ8PVyHEeZIokNRtVetBq98IpOenQrY">
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">MIAR Garçom</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium mt-0.5">Sistema Inteligente de Salão</p>
</div>
<div class="flex flex-col gap-space-md w-full max-w-md mx-auto">
<div class="bg-surface-container-low rounded-xl p-space-sm flex items-center justify-between shadow-sm">
<div class="flex items-center gap-space-xs min-w-0">
<span class="material-symbols-outlined text-primary-fixed-dim text-[20px]">storefront</span>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Unidade Operacional</span>
<span class="font-label-md text-label-md text-on-surface truncate">Bistrô Jardins - Matriz</span>
</div>
</div>
<button aria-label="Alterar restaurante" class="p-space-xs rounded-lg text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</button>
</div>
<form class="flex flex-col gap-space-sm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase ml-1" for="cred-input">E-mail ou Matrícula</label>
<div class="relative flex items-center bg-surface-container rounded-xl overflow-hidden shadow-sm">
<span class="material-symbols-outlined absolute left-space-sm text-outline text-[20px] pointer-events-none">badge</span>
<input class="w-full bg-transparent pl-11 pr-space-md py-3.5 text-on-surface font-body-md text-body-md focus:outline-none placeholder-outline" id="cred-input" placeholder="ex: GT-1042 ou email@miar.com" type="text" value="GT-1042">
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase ml-1" for="pass-input">Senha de Acesso</label>
<div class="relative flex items-center bg-surface-container rounded-xl overflow-hidden shadow-sm">
<span class="material-symbols-outlined absolute left-space-sm text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-transparent pl-11 pr-11 py-3.5 text-on-surface font-body-md text-body-md focus:outline-none placeholder-outline" id="pass-input" placeholder="Sua senha corporativa" type="password" value="••••••••">
<button aria-label="Alternar visibilidade da senha" class="absolute right-space-sm text-outline hover:text-on-surface flex items-center justify-center p-1" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<button class="mt-space-2xs w-full h-[52px] bg-primary-container hover:bg-secondary-container active:scale-[0.98] transition-all rounded-xl flex items-center justify-center gap-space-xs text-on-primary font-headline-sm text-headline-sm shadow-md" type="button">
<span>Entrar no Sistema</span>
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute px-space-sm bg-surface font-label-sm text-label-sm text-on-surface-variant uppercase">
        ou acesso ágil no turno
      </span>
</div>
<div class="bg-surface-container-low rounded-xl p-space-md flex flex-col items-center shadow-md">
<div class="flex items-center gap-1.5 mb-space-sm">
<span class="material-symbols-outlined text-primary-fixed-dim text-[18px]">dialpad</span>
<span class="font-label-md text-label-md text-primary tracking-wide uppercase">Entrar com PIN Rápido</span>
</div>
<div class="flex items-center justify-center gap-space-sm mb-space-md">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center shadow-inner transition-colors" id="pin-slot-0">
<span class="w-2.5 h-2.5 rounded-full bg-outline transition-all duration-150 scale-75"></span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center shadow-inner transition-colors" id="pin-slot-1">
<span class="w-2.5 h-2.5 rounded-full bg-outline transition-all duration-150 scale-75"></span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center shadow-inner transition-colors" id="pin-slot-2">
<span class="w-2.5 h-2.5 rounded-full bg-outline transition-all duration-150 scale-75"></span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center shadow-inner transition-colors" id="pin-slot-3">
<span class="w-2.5 h-2.5 rounded-full bg-outline transition-all duration-150 scale-75"></span>
</div>
</div>
<div class="grid grid-cols-3 gap-space-xs w-full max-w-[280px]">
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('1')" type="button">1</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('2')" type="button">2</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('3')" type="button">3</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('4')" type="button">4</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('5')" type="button">5</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('6')" type="button">6</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('7')" type="button">7</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('8')" type="button">8</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('9')" type="button">9</button>
<button aria-label="Limpar PIN" class="h-12 rounded-xl bg-surface-container-lowest text-outline hover:text-on-surface font-label-md text-label-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="clearPin()" type="button">C</button>
<button class="h-12 rounded-xl bg-surface-container text-on-surface font-headline-md text-headline-md flex items-center justify-center active:bg-surface-variant transition-colors" onclick="handlePinKey('0')" type="button">0</button>
<button aria-label="Apagar dígito" class="h-12 rounded-xl bg-surface-container-lowest text-outline hover:text-on-surface flex items-center justify-center active:bg-surface-variant transition-colors" onclick="deletePinKey()" type="button">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
</div>
<div class="flex flex-col items-center gap-1.5 mt-space-xs text-center">
<div class="inline-flex items-center gap-2 px-space-sm py-1 rounded-full bg-surface-container-high">
<span class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-tertiary font-semibold">Online • Cozinha Conectada</span>
</div>
<p class="font-label-sm text-label-sm text-outline">v2.4.0 SaaS Enterprise • MIAR Intelligence</p>
</div>
</div>
</div>
<script>
  let pin = "";
  const pwdInput = document.getElementById("pass-input");
  const pwdBtn = document.getElementById("toggle-pwd-btn");
  const pwdIcon = document.getElementById("pwd-icon");

  if (pwdBtn && pwdInput && pwdIcon) {
    pwdBtn.addEventListener("click", () => {
      const isPwd = pwdInput.type === "password";
      pwdInput.type = isPwd ? "text" : "password";
      pwdIcon.textContent = isPwd ? "visibility_off" : "visibility";
    });
  }

  function updatePinDisplay() {
    for (let i = 0; i < 4; i++) {
      const slot = document.getElementById("pin-slot-" + i);
      if (!slot) continue;
      const dot = slot.firstElementChild;
      if (i < pin.length) {
        slot.classList.remove("bg-surface-container-highest");
        slot.classList.add("bg-primary-container");
        if (dot) {
          dot.classList.remove("bg-outline", "scale-75");
          dot.classList.add("bg-on-primary", "scale-100");
        }
      } else {
        slot.classList.remove("bg-primary-container");
        slot.classList.add("bg-surface-container-highest");
        if (dot) {
          dot.classList.remove("bg-on-primary", "scale-100");
          dot.classList.add("bg-outline", "scale-75");
        }
      }
    }
  }

  window.handlePinKey = function(digit) {
    if (pin.length < 4) {
      pin += digit;
      updatePinDisplay();
      if (pin.length === 4) {
        setTimeout(() => {
          pin = "";
          updatePinDisplay();
        }, 500);
      }
    }
  };

  window.deletePinKey = function() {
    if (pin.length > 0) {
      pin = pin.slice(0, -1);
      updatePinDisplay();
    }
  };

  window.clearPin = function() {
    pin = "";
    updatePinDisplay();
  };
</script></main></body></html>
