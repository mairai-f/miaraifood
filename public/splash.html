<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIAR AI/FOOD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand {
            display: grid;
            justify-items: center;
            gap: 18px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            animation: reveal .45s ease-out both;
        }
        .brand img {
            width: 116px;
            height: 116px;
            filter: drop-shadow(0 0 28px rgba(112,224,0,.34));
        }
        .brand strong { font-size: 32px; letter-spacing: -.06em; }
        .brand span { color: #70e000; }
        .brand small { color: #b9d7c4; font-size: 14px; letter-spacing: .03em; }
        @keyframes reveal {
            from { opacity: 0; transform: scale(.94); }
            to { opacity: 1; transform: scale(1); }
        }
        .skip-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 1.5s forwards;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .skip-hint kbd {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 3px 8px;
            font-family: monospace;
            font-size: 15px;
            margin: 0 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body tabindex="0">
    <div class="brand">
        <img src="miar-logo-white.svg" alt="MIAR AI/FOOD">
        <strong>MIAR <span>AI/FOOD</span></strong>
        <small>Da mesa à entrega, toda a operação conectada.</small>
    </div>
    <div class="skip-hint">Pressione <kbd>Espaço</kbd> para pular</div>
    <script>
        window.setTimeout(() => window.close(), 2200);

        const skipSplash = (e) => {
            if (e && e.type && e.type.startsWith('key')) {
                // Verifica se foi a barra de espaço
                if (e.key !== " " && e.code !== "Space" && e.keyCode !== 32) {
                    return;
                }
            }
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            window.close();
        };

        // Usa 'true' para o Capture Phase, pegando o evento antes de qualquer elemento
        window.addEventListener('keydown', skipSplash, true);
        window.addEventListener('keyup', skipSplash, true);
        window.addEventListener('click', skipSplash, true);
        
        // Garante que o body possa receber eventos de teclado
        document.body.focus();
        window.focus();
    </script>
</body>
</html>
