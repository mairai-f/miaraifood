project_id = "ymffclntmynwfdiarlaw"

[auth]
enabled = true
site_url = "https://www.happycashsite.com.br"
additional_redirect_urls = [
  "https://www.happycashsite.com.br/**",
  "https://app.happycashsite.com.br/**",
  "https://food.happycashsite.com.br/**",
  "https://agenda.happycashsite.com.br/**",
  "http://localhost:8080/**",
  "http://localhost:8081/**",
  "http://localhost:8082/**",
  "http://127.0.0.1:8080/**",
  "http://127.0.0.1:8081/**",
  "http://127.0.0.1:8082/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Codigo de recuperacao HappyCash"
content_path = "./supabase/templates/magic-link.html"

[auth.captcha]
enabled = false

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "HappyCash"
rp_id = "happycashsite.com.br"
rp_origins = [
  "https://www.happycashsite.com.br",
  "https://app.happycashsite.com.br",
  "https://food.happycashsite.com.br",
  "https://agenda.happycashsite.com.br",
]

[auth.external.apple]
skip_nonce_check = true
email_optional = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[functions.register-account]
verify_jwt = false

[functions.admin-login]
verify_jwt = false

# Estas funcoes validam o Bearer token manualmente com auth.getUser().
# Mantemos verify_jwt desativado para evitar falha do gateway com JWTs
# assinados de forma assimetrica, como ES256.
[functions.activate-plan]
verify_jwt = false

[functions.create-plan-charge]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

[functions.desktop-download]
verify_jwt = false

[functions.desktop-license]
verify_jwt = false

[functions.desktop-activate]
verify_jwt = false

[functions.finalize-site-registration]
verify_jwt = false

[functions.track-access]
verify_jwt = false

[functions.manage-operators]
verify_jwt = false

[functions.manage-fiscal-documents]
verify_jwt = false

[functions.operator-login]
verify_jwt = false

[functions.authorize-pricing-manager]
verify_jwt = false

[functions.authorize-store-admin]
verify_jwt = false

[functions.public-menu]
verify_jwt = false

[functions.create-public-menu-order]
verify_jwt = false

[functions.send-agenda-reminders]
verify_jwt = false
