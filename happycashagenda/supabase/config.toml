# Compatibilidade legada: o Supabase canonico do HappyCash fica em /supabase.
# Mantemos este arquivo alinhado ao projeto principal para evitar apontar
# acidentalmente o HappyCash Agenda para outro projeto Supabase/Auth.
project_id = "ymffclntmynwfdiarlaw"

[auth]
enabled = true
site_url = "https://agenda.happycashsite.com.br"
additional_redirect_urls = [
  "https://agenda.happycashsite.com.br/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
]

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[functions.send-whatsapp-notification]
verify_jwt = true

[functions.create-payment]
verify_jwt = true

[functions.send-agenda-reminders]
verify_jwt = false
